<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Frontline</title>
</head>
<body>
<main id="app">
  <div id="map"></div>
  <header class="hud-top">
    <span class="map-name" id="map-name">Lade Karte …</span>
    <span class="spacer"></span>
    <button class="hud-btn" id="btn-reinf" type="button" hidden>Verstärkung</button>
    <button class="hud-btn" id="btn-box" type="button" aria-pressed="false">Rahmen</button>
    <button class="hud-btn" id="btn-speed" type="button">Tempo 1×</button>
    <button class="hud-btn" id="btn-fit" type="button">Ganze Karte</button>
    <button class="hud-btn" id="btn-test" type="button" aria-expanded="false">Test ▾</button>
  </header>
  <div class="test-menu" id="test-menu" hidden>
    <button class="hud-btn" id="btn-reveal" type="button" aria-pressed="false">Alle Gegner zeigen</button>
    <button class="hud-btn" id="btn-wander" type="button" aria-pressed="true">Gegner fahren herum</button>
    <button class="hud-btn" id="btn-raster" type="button" aria-pressed="false">Gelände-Raster</button>
    <button class="hud-btn" id="btn-newbattle" type="button">Neues Gefecht</button>
    <button class="hud-btn" id="btn-fastforward" type="button" aria-pressed="false">Zeitraffer 10×</button>
    <button class="hud-btn" id="btn-battle" type="button">Sandkasten 6 gegen 6</button>
    <button class="hud-btn" id="btn-range" type="button">Schießstand ▸</button>
  </div>
  <div class="test-menu duel-menu" id="duel-menu" hidden>
    <button class="hud-btn" id="btn-range-back" type="button">◂ Zurück</button>
  </div>
  <ul class="feed" id="feed" hidden></ul>
  <div class="score" id="score" hidden>
    <div class="score-row"><b class="s-blue" id="score-blue">0</b>
      <div class="score-track"><span class="bar-blue" id="score-bar-blue"></span><span class="bar-red" id="score-bar-red"></span></div>
      <b class="s-red" id="score-red">0</b></div>
    <div class="score-sub" id="score-sectors"></div>
  </div>
  <section class="reinf" id="reinf" hidden>
    <h2>Verstärkung</h2>
    <p class="sub">Einheit wählen, dann Ziel auf der Karte antippen</p>
    <div class="reinf-list" id="reinf-list"></div>
  </section>
  <div class="end" id="end" hidden>
    <div class="end-box"><h1 id="end-title"></h1><p id="end-text"></p>
      <button class="hud-btn" id="btn-end-restart" type="button">Neues Gefecht</button></div>
  </div>
  <div class="box-layer" id="box-layer" hidden><div class="box" id="box" hidden></div></div>
  <p class="info" id="info" hidden></p>
  <section class="card" id="card" hidden></section>
  <nav class="orders" id="orders" hidden>
    <button class="hud-btn" id="btn-move" type="button" aria-pressed="true">Bewegen</button>
    <button class="hud-btn" id="btn-fast" type="button" aria-pressed="false">Schnell</button>
    <button class="hud-btn" id="btn-stop" type="button">Stopp</button>
    <button class="hud-btn" id="btn-fire" type="button" aria-pressed="false">Feuer frei</button>
    <button class="hud-btn" id="btn-deselect" type="button" aria-label="Auswahl aufheben">✕</button>
  </nav>
  <footer class="hud-bottom">
    <div class="scale"><span class="scale-bar" id="scale-bar"></span><span id="scale-label"></span></div>
    <span class="spacer"></span>
    <span class="attribution" id="attribution"></span>
  </footer>
  <div class="rotate" id="rotate">Bitte das Handy quer halten</div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
